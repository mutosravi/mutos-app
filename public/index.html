<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf6f2">
<title>Muto's</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap">
<link rel="stylesheet" href="/app.css">
<script src="/config.js"></script>
<script src="/app-core.js"></script>
</head>
<body>
<main class="signin">
  <span class="logo" role="img" aria-label="Muto's"><b aria-hidden="true">Muto's</b></span>
  <h1>Team app</h1>
  <p class="sub" id="msg">Checking your sign-in…</p>
  <div id="signin" class="card" hidden>
    <button type="button" class="btn primary" id="go-google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true" style="background:#fff;border-radius:50%;padding:2px;box-sizing:content-box"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.9 6.2C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.4 5.7c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.6 28.6A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.2A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l8-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.8l-8 6.2C6.6 42.6 14.6 48 24 48z"/></svg>
      Sign in with Google
    </button>
    <p class="sub" style="margin:14px 0 0">Use the Gmail address you gave the studio. <a href="/privacy.html">Privacy</a></p>
  </div>
  <div id="unknown" class="card" hidden>
    <p class="sub" style="margin:0 0 14px">You are signed in as <b id="unk-email"></b>, but this account is not on the team list yet. Send this address to Ravi on WhatsApp, then come back and tap Try again.</p>
    <div style="display:flex;flex-direction:column;gap:8px"><button type="button" class="btn primary" id="retry">Try again</button><button type="button" class="btn" id="other">Use another Google account</button></div>
  </div>
</main>
<script>
(async function () {
  const $ = id => document.getElementById(id), msg = $('msg'), app = window.mutosApp;
  const cfg = window.MUTOS_CONFIG || {};
  if (!window.__mutosTestClient && (!cfg.supabaseUrl || cfg.supabaseUrl.includes('YOUR-PROJECT'))) { msg.textContent = 'The app is not set up yet: fill in config.js (see README).'; return; }
  $('go-google').addEventListener('click', () => { msg.textContent = 'Opening Google…'; window.mutosApp.signIn(); });
  $('retry').addEventListener('click', () => location.reload());
  $('other').addEventListener('click', () => window.mutosApp.signOut());
  try {
    const me = await window.mutosApp.me();
    if (!me) { msg.textContent = 'Sign in to see your shoots.'; $('signin').hidden = false; return; }
    if (me.role && app.homeFor(me.role) !== '/') { msg.textContent = 'Opening…'; location.replace(app.homeFor(me.role)); return; }
    msg.textContent = 'Almost there.'; $('unk-email').textContent = me.email; $('unknown').hidden = false;
  } catch (e) {
    msg.innerHTML = ''; const s = document.createElement('span'); s.className = 'err'; s.textContent = 'Could not reach the app (' + (e && e.message || e) + '). Check your internet and reload.'; msg.appendChild(s);
  }
})();
</script>
</body>
</html>
