<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Muto's</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muto's">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/config.js"></script>
<script src="/app-core.js"></script>
<style>
/* Welcome (chosen 10 Nov 2026, sample 6B): white, MUTO'S in dark maroon caps, Apple's system font, letters appear one by one.
   Nothing else on screen; signed out, one "Continue with Google" button comes in at the bottom. */
:root { --ink: #5C1A2B; --sys: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
html, body { margin: 0; height: 100%; background: #FFFFFF; color: var(--ink); font-family: var(--sys); -webkit-font-smoothing: antialiased; }
.w-page { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 24px calc(56px + env(safe-area-inset-bottom)); }
.w-word { flex: 1; display: flex; align-items: center; justify-content: center; }
.w-word h1 { margin: 0; display: flex; font-size: 28px; font-weight: 400; letter-spacing: 0.12em; padding-left: 0.12em; line-height: 1; color: var(--ink); }
.w-word h1 span { display: inline-block; opacity: 0; animation: w-in .75s ease-out forwards; }
@keyframes w-in { from { opacity: 0; filter: blur(8px); transform: translateY(8px); } to { opacity: 1; filter: none; transform: none; } }
.w-foot { width: 100%; max-width: 420px; min-height: 54px; margin: 0 auto; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; } /* the button's room is kept, so the word never jumps */
.w-foot > [hidden] { display: none !important; }
.w-fade { animation: w-up .5s ease-out both; }
@keyframes w-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.w-btn { width: 100%; min-height: 54px; border: 0; border-radius: 14px; background: var(--ink); color: #FFFFFF; font: 600 17px/1.2 var(--sys); cursor: pointer; }
.w-btn.light { background: #FFFFFF; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.w-btn:focus-visible { outline: 3px solid #C9973F; outline-offset: 3px; }
.w-note { margin: 0; font-size: 15px; line-height: 1.45; text-align: center; color: #3A2A2E; }
#msg:empty { display: none; }
.err { color: #9A2B1E; }
@media (prefers-reduced-motion: reduce) { .w-word h1 span, .w-fade { animation: none; opacity: 1; } }
</style>
</head>
<body>
<main class="w-page">
  <div class="w-word">
    <h1 aria-label="Muto’s"><span aria-hidden="true">M</span><span aria-hidden="true">U</span><span aria-hidden="true">T</span><span aria-hidden="true">O</span><span aria-hidden="true">’</span><span aria-hidden="true">S</span></h1>
  </div>
  <div class="w-foot">
    <p class="w-note" id="msg" role="status" aria-live="polite"></p>
    <div id="signin" class="w-fade" hidden>
      <button type="button" class="w-btn" id="go-google">Continue with Google</button>
    </div>
    <div id="unknown" class="w-fade" hidden>
      <p class="w-note" style="margin-bottom:14px">You are signed in as <b id="unk-email"></b>, but this account is not on the team list yet. Send this address to Ravi on WhatsApp, then tap Try again.</p>
      <div style="display:flex;flex-direction:column;gap:10px"><button type="button" class="w-btn" id="retry">Try again</button><button type="button" class="w-btn light" id="other">Use another Google account</button></div>
    </div>
  </div>
</main>
<script>
(async function () {
  const $ = id => document.getElementById(id), msg = $('msg'), app = window.mutosApp;
  // the word's letters come in one by one; the page moves on once it has finished (sooner with reduced motion)
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.w-word h1 span').forEach((s, i) => { s.style.animationDelay = (i * 0.12).toFixed(2) + 's'; });
  const shown = new Promise(r => setTimeout(r, still ? 300 : 1300));
  const after = async fn => { await shown; fn(); };
  const cfg = window.MUTOS_CONFIG || {};
  if (!window.__mutosTestClient && (!cfg.supabaseUrl || cfg.supabaseUrl.includes('YOUR-PROJECT'))) { msg.textContent = 'The app is not set up yet: fill in config.js (see README).'; return; }
  $('go-google').addEventListener('click', () => { $('go-google').disabled = true; window.mutosApp.signIn(); });
  $('retry').addEventListener('click', () => location.reload());
  $('other').addEventListener('click', () => window.mutosApp.signOut());
  try {
    const me = await window.mutosApp.me();
    if (!me) { after(() => { $('signin').hidden = false; }); return; }
    if (me.role && app.homeFor(me.role) !== '/') { after(() => location.replace(app.homeFor(me.role))); return; }
    // a client: their Gmail is on a wedding's list
    const cl = await (await app.client()).rpc('client_list');
    if (cl && cl.data && cl.data.length) { after(() => location.replace('/client.html')); return; }
    after(() => { $('unk-email').textContent = me.email; $('unknown').hidden = false; });
  } catch (e) {
    after(() => { const s = document.createElement('span'); s.className = 'err'; s.textContent = 'Could not reach the app (' + (e && e.message || e) + '). Check your internet and reload.'; msg.appendChild(s); });
  }
})();
</script>
</body>
</html>
