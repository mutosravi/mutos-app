<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#9E4F62">
<title>Muto's</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muto's">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/config.js"></script>
<script src="/app-core.js"></script>
<style>
/* Welcome (chosen 10 Nov 2026 on the "Muto's welcome screen" canvas: S3's dusty-rose background, W3's thin MUTO'S, S4's Google button).
   Letters appear one by one; nothing else on screen. Signed out: Google's own white button comes in just under the name. */
:root { --bg: #9E4F62; --ink: #FFFFFF; --sys: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sys); -webkit-font-smoothing: antialiased; }
/* golden ratio (1.618): space above : below the name and button = 1 : 1.618; name 39px = 15px button text x 1.618^2;
   gap 63px = 39 x 1.618; button width = name width x 1.618 (measured on the phone, below) */
.w-page { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
.w-page::before { content: ''; flex-grow: 1; } .w-page::after { content: ''; flex-grow: 1.618; }
.w-word { display: flex; align-items: center; justify-content: center; transition: transform .7s cubic-bezier(.22,.8,.3,1); }
/* the name first stands in the exact centre (JS moves it there), then slides up to its place when the button comes in */
.w-word h1 { margin: 0; display: flex; font-size: 39px; font-weight: 300; letter-spacing: 0.08em; padding-left: 0.08em; line-height: 1; color: var(--ink); }
.w-word h1 .k { letter-spacing: 0; } /* the apostrophe sits close: MUTO'S, not MUTO ' S */
.w-word h1 span { display: inline-block; opacity: 0; animation: w-in .75s ease-out forwards; }
@keyframes w-in { from { opacity: 0; filter: blur(8px); transform: translateY(8px); } to { opacity: 1; filter: none; transform: none; } }
.w-foot { width: 100%; max-width: 420px; min-height: 44px; margin: 63px auto 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px; } /* just under the name; the button's room is kept, so the name never jumps */
.w-foot > [hidden] { display: none !important; }
.w-fade { animation: w-up .5s ease-out both; }
@keyframes w-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
/* Google's own sign-in button: white, grey border, coloured G */
.w-g { width: var(--gw, 272px); max-width: 100%; justify-content: center; min-height: 44px; padding: 0 14px; border: 1px solid #747775; border-radius: 8px; background: #FFFFFF; color: #1F1F1F; font: 600 15px/1.2 var(--sys); display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.w-g:disabled { opacity: .7; }
.w-btn { width: 100%; min-height: 50px; border: 0; border-radius: 999px; background: #FFFFFF; color: #5C1A2B; font: 600 16px/1.2 var(--sys); cursor: pointer; }
.w-btn.light { background: transparent; color: #FFFFFF; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.8); }
.w-btn:focus-visible { outline: 3px solid #C9973F; outline-offset: 3px; }
.w-note { margin: 0; font-size: 15px; line-height: 1.45; text-align: center; color: #FFFFFF; }
#msg:empty { display: none; }
.err { color: #FFE3DC; }
@media (prefers-reduced-motion: reduce) { .w-word h1 span, .w-fade { animation: none; opacity: 1; } }
</style>
</head>
<body>
<main class="w-page">
  <div class="w-word">
    <h1 aria-label="Muto’s"><span aria-hidden="true">M</span><span aria-hidden="true">U</span><span aria-hidden="true">T</span><span aria-hidden="true" class="k">O</span><span aria-hidden="true" class="k">’</span><span aria-hidden="true">S</span></h1>
  </div>
  <div class="w-foot">
    <p class="w-note" id="msg" role="status" aria-live="polite"></p>
    <div id="signin" class="w-fade" hidden>
      <button type="button" class="w-g" id="go-google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.9 6.2C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.4 5.7c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.6 28.6A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.2A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l8-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.8l-8 6.2C6.6 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>
    </div>
    <div id="unknown" class="w-fade" style="width:100%" hidden>
      <p class="w-note" style="margin-bottom:14px">You are signed in as <b id="unk-email"></b>, but this account is not on the team list yet. Send this address to Ravi on WhatsApp, then tap Try again.</p>
      <div style="display:flex;flex-direction:column;gap:10px"><button type="button" class="w-btn" id="retry">Try again</button><button type="button" class="w-btn light" id="other">Use another Google account</button></div>
    </div>
  </div>
</main>
<script>
(async function () {
  const $ = id => document.getElementById(id), msg = $('msg'), app = window.mutosApp;
  // the word's letters come in one by one; the page moves on once it has finished (sooner with reduced motion)
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.w-word h1 span').forEach((s, i) => { s.style.animationDelay = (i * 0.12).toFixed(2) + 's'; });
  // the button is 1.618 times as wide as the name (the name's width depends on the phone's font)
  const nameW = document.querySelector('.w-word h1').getBoundingClientRect().width;
  if (nameW > 0) document.documentElement.style.setProperty('--gw', Math.round(nameW * 1.618) + 'px');
  const shown = new Promise(r => setTimeout(r, still ? 300 : 1500));
  const after = async fn => { await shown; fn(); };
  // the name starts in the exact centre of the screen; rise() slides it up to its golden-ratio place
  const word = document.querySelector('.w-word');
  let risen = false;
  const centre = () => { if (risen || still) return; word.style.transition = 'none'; word.style.transform = 'none'; const r = word.getBoundingClientRect(); word.style.transform = 'translateY(' + Math.round(window.innerHeight / 2 - (r.top + r.height / 2)) + 'px)'; void word.offsetHeight; word.style.transition = ''; };
  centre(); window.addEventListener('resize', centre);
  const rise = then => { risen = true; word.style.transform = 'none'; setTimeout(then, still ? 0 : 180); };
  const cfg = window.MUTOS_CONFIG || {};
  if (!window.__mutosTestClient && (!cfg.supabaseUrl || cfg.supabaseUrl.includes('YOUR-PROJECT'))) { msg.textContent = 'The app is not set up yet: fill in config.js (see README).'; return; }
  $('go-google').addEventListener('click', () => { $('go-google').disabled = true; window.mutosApp.signIn(); });
  $('retry').addEventListener('click', () => location.reload());
  $('other').addEventListener('click', () => window.mutosApp.signOut());
  try {
    const me = await window.mutosApp.me();
    if (!me) { after(() => rise(() => { $('signin').hidden = false; })); return; }
    if (me.role && app.homeFor(me.role) !== '/') { after(() => location.replace(app.homeFor(me.role))); return; }
    // a client: their Gmail is on a wedding's list
    const cl = await (await app.client()).rpc('client_list');
    if (cl && cl.data && cl.data.length) { after(() => location.replace('/client.html')); return; }
    after(() => rise(() => { $('unk-email').textContent = me.email; $('unknown').hidden = false; }));
  } catch (e) {
    after(() => rise(() => { const s = document.createElement('span'); s.className = 'err'; s.textContent = 'Could not reach the app (' + (e && e.message || e) + '). Check your internet and reload.'; msg.appendChild(s); }));
  }
})();
</script>
</body>
</html>
