<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf6f2">
<title>Your functions · Muto's</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muto's">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
.fn { background: var(--surface); border-radius: 20px; margin: 10px 0; box-shadow: var(--shadow); overflow: hidden; }
/* each card is a one-line summary; tapping it opens the details (11 Nov 2026: "an easy UI with itinerary update") */
.fn-sum { display: flex; gap: 12px; align-items: center; width: 100%; background: none; border: 0; padding: 14px 16px; text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
.fn-sum .txt { flex: 1 1 auto; min-width: 0; }
.fn-sum h2 { margin: 0; font-size: 16.5px; font-weight: 700; line-height: 1.25; }
.fn-sum .meta { display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fn-sum .go { flex: none; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 6px 12px; background: var(--rose); color: #fff; }
.fn-sum .go.ok { background: #dcebe6; color: #1f4d43; }
.fn-sum .chev { flex: none; transition: transform .2s; color: var(--muted); }
.fn.open .fn-sum .chev { transform: rotate(90deg); }
.fn-body { display: none; padding: 0 16px 16px; }
.fn.open .fn-body { display: block; }
.shortnote { background: #fbf1d9; color: #5c4410; border-radius: 14px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; margin-top: 2px; }
.shortnote b { display: block; font-size: 13.5px; }
.bar .pillbtn.pulse { box-shadow: 0 0 0 3px var(--honey); }
.done-btn { margin-top: 14px; width: 100%; }
.sechead2 { margin: 22px 2px 4px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fn-head { display: flex; gap: 12px; align-items: flex-start; }
.fn-head .txt { flex: 1 1 auto; min-width: 0; }
.fn-head h2 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.25; }
.fn-head .meta { margin-top: 2px; }
.fn .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.fn .grid label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); }
.fn .grid .wide { grid-column: 1 / -1; }
.fn .hint { font-weight: 400; font-size: 12px; color: var(--muted); }
.fn.done { box-shadow: var(--shadow), inset 4px 0 0 #3d7a6e; }
.fn .grid:first-child { margin-top: 4px; }
.fn .x { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 0; }
.bar { position: sticky; bottom: 0; background: linear-gradient(rgba(251,246,242,0), var(--bg) 30%); padding: 18px 0 max(16px, env(safe-area-inset-bottom)); display: flex; gap: 8px; }
.bar .pillbtn { flex: 1; }
.saved { font-size: 12px; color: var(--muted); text-align: center; margin: 6px 0 0; min-height: 16px; }
.progress { height: 8px; border-radius: 4px; background: rgba(255,255,255,.7); overflow: hidden; }
.ppl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--sand); }
.ppl .wide { grid-column: 1 / -1; }
.ppl label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); }
.vip { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--sand); }
.vip .ph { width: 72px; height: 72px; border-radius: 16px; background: var(--blush) center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); text-align: center; cursor: pointer; position: relative; overflow: hidden; }
.vip .ph input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.vip .f { display: grid; gap: 6px; }
.vip .ph.busy { opacity: .55; }
/* reference photos (14 Nov 2026): kept on the studio's Google Drive, ~3000px */
.refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
.refs .rf { display: grid; gap: 6px; }
.refs .rf button.open { border: 0; padding: 0; background: var(--blush) center/cover no-repeat; border-radius: 14px; aspect-ratio: 1; cursor: zoom-in; width: 100%; }
.refs .rf .in { font-size: 13px; padding: 8px 10px; }
.upbar { height: 6px; border-radius: 3px; background: var(--sand); overflow: hidden; margin-top: 8px; }
.upbar i { display: block; height: 100%; background: var(--rose); width: 0; transition: width .2s; }
.addrow { background: none; border: 1.5px dashed var(--line); border-radius: 14px; padding: 10px; width: 100%; margin-top: 10px; font: 600 13px var(--font-body); color: var(--ink); cursor: pointer; }
.progress i { display: block; height: 100%; background: var(--rose); border-radius: 4px; transition: width .3s; }
@media (max-width: 380px) { .fn .grid { grid-template-columns: 1fr; } }
</style>
<script src="/config.js"></script>
<script src="/app-core.js"></script>
<script src="/icons.js"></script>
<script src="/photos.js"></script>
</head>
<body>
<main class="wrap" style="padding-bottom:24px">
  <header class="hdr"><span class="logo" role="img" aria-label="Muto's"><b aria-hidden="true">Muto's</b></span><div class="hdr-acts"><button type="button" class="roundbtn" id="out" aria-label="Sign out" title="Sign out" hidden></button></div></header>
  <div id="pick" class="chipset" style="margin-top:8px"></div>
  <section id="top"><div class="hero"><p>Loading your functions…</p></div></section>
  <div id="list"></div>
  <div id="more" hidden><button type="button" class="pillbtn light" id="add-fn" style="width:100%;box-shadow:var(--shadow)">＋ Add a function</button></div>
  <div class="bar" id="bar" hidden><button type="button" class="pillbtn light" id="save">Save</button><button type="button" class="pillbtn" id="send">Send to Muto's</button></div>
  <p class="saved" id="saved"></p>
  <div class="toast" id="toast" hidden></div>
</main>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
  const wanted = new URLSearchParams(location.search).get('k') || '';
  const dayName = s => new Date(s + 'T12:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
  const dblock = s => { const d = new Date(s + 'T12:00:00'); return '<span class="dblock"><b>' + d.getDate() + '</b><span>' + d.toLocaleDateString('en-IN', { month: 'short' }) + '</span></span>'; };
  let toastT = null;
  const toast = (m, bad) => { const t = $('toast'); t.textContent = m; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4000); };
  const card = html => { $('top').innerHTML = '<div class="hero">' + html + '</div>'; };
  const fail = m => card('<h2>Something is not right</h2><p>' + esc(m) + '</p>');
  const app = window.mutosApp;
  $('out').innerHTML = window.MUTOS_ICON('logout', 20);
  $('out').addEventListener('click', () => app.signOut());

  // 1. signed in with Google?
  let c, session;
  try { c = await app.client(); session = await app.session(); } catch (e) { fail('Could not connect. Check your internet and try again.'); return; }
  if (!session) {
    card('<h2>Your wedding with Muto\'s</h2><p>Sign in with the Gmail you gave Muto\'s to fill in the details of your functions.</p>' +
      '<button type="button" class="pillbtn" id="gsign" style="width:100%">Sign in with Google</button><p style="font-size:12px;margin-top:4px">Only the Gmail you gave us can open your page. <a href="/privacy.html">Privacy</a></p>');
    $('gsign').addEventListener('click', () => { try { sessionStorage.setItem('mutos-client-k', wanted); } catch (e) {} app.signIn(); });
    return;
  }
  $('out').hidden = false;
  const email = String(session.user.email || '').toLowerCase();
  // 2. which weddings this Gmail may open (the owner and managers may preview any page they open with ?k=)
  const { data: mine, error: le } = await c.rpc('client_list');
  if (le) { fail('Could not open your page (' + le.message + '). Try again in a minute.'); return; }
  let remembered = ''; try { remembered = sessionStorage.getItem('mutos-client-k') || ''; } catch (e) {}
  const want = wanted || remembered, list = mine || [];
  const token = (list.find(w => w.token === want) || list[0] || {}).token || want;
  if (!token) {
    card('<h2>We could not find your wedding</h2><p>You are signed in as <b>' + esc(email) + '</b>, but this Gmail is not on Muto\'s list yet. Send this Gmail to Muto\'s on WhatsApp, then tap Try again. Or sign in with the Gmail you gave us.</p>' +
      '<div class="pillrow"><button type="button" class="pillbtn" id="again">Try again</button><button type="button" class="pillbtn light" id="other">Another Gmail</button></div>');
    $('again').addEventListener('click', () => location.reload()); $('other').addEventListener('click', () => app.signOut());
    return;
  }
  if (list.length > 1) $('pick').innerHTML = list.map(w => '<a href="/client.html?k=' + esc(w.token) + '" style="text-decoration:none"><span class="' + (w.token === token ? 'dark' : '') + '">' + esc(w.title) + '</span></a>').join('');
  const { data: got, error } = await c.rpc('client_get', { p_token: token });
  if (error || !got || got.error) {
    if (got && got.not_listed) { card('<h2>Not your wedding?</h2><p>' + esc(got.error) + ' Sign in with the Gmail you gave Muto\'s.</p><button type="button" class="pillbtn light" id="other" style="width:100%">Use another Gmail</button>'); $('other').addEventListener('click', () => app.signOut()); }
    else fail((got && got.error) || 'Could not open your details. Check your internet and try again.');
    return;
  }
  try { sessionStorage.removeItem('mutos-client-k'); } catch (e) {}
  // studio_edit (012): owner, manager or supervisor opened it; they may edit it for the family, but only the family "sends" it
  const studio = !!got.studio_edit, preview = !!got.preview && !studio, bk = got.booking || null, late = !!(bk && bk.overdue > 0);
  const inr = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
  const KL = { reel: 'Reel', teaser: 'Teaser', trailer: 'Trailer', highlight: 'Highlight film', full: 'Full film', top: 'Top selected photos', lr: 'Edited photos', album_sel: 'Album photo selection', album: 'Album', other: 'Other' };

  const today = new Date(Date.now() + 330 * 60000).toISOString().slice(0, 10);
  const fns = (got.functions || []).slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const ans = Object.assign({ extra: [] }, got.answers || {});
  if (!Array.isArray(ans.extra)) ans.extra = [];
  if (!Array.isArray(ans.contacts)) ans.contacts = [];
  if (!Array.isArray(ans.vip)) ans.vip = [];
  if (!Array.isArray(ans.refs)) ans.refs = [];   // reference photos { pid, note, fn } (14 Nov 2026)
  const P = window.MutosPhotos, drv = P ? await P.status(c).catch(() => ({})) : {}, onDrive = !!drv.connected;   // photos go to the studio's Google Drive
  if (!ans.couple || typeof ans.couple !== 'object') ans.couple = {};   // { bride, groom } (12 Nov 2026, Ravi)
  // a photo from the phone, shrunk to a small JPEG (about 20–40 KB) so it saves quickly
  const shrink = file => new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const max = 360, k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.72)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file is not a photo.')); };
    img.src = url;
  });
  let submittedAt = got.submitted_at, dirty = false;

  const FIELDS = [
    ['time', 'Function starts at', 'time', ''],
    ['guests', 'About how many guests', 'number', 'e.g. 300'],
    ['venue', 'Venue name', 'text', 'e.g. Taj Mahal Hotel', 'wide'],
    ['address', 'Full address', 'textarea', 'Area, landmark, city', 'wide'],
    ['map', 'Google Maps link', 'url', 'Paste the location link', 'wide', 'In Google Maps: tap the place → Share → Copy link'],
    ['contact', 'Contact person at the venue', 'text', 'Name'],
    ['phone', 'Their phone', 'tel', '10-digit mobile'],
    ['notes', 'Anything our team should know', 'textarea', 'Rituals, special moments, family members to cover, entry time of the couple…', 'wide']
  ];
  const filled = a => !!(a && a.time && a.venue && a.address);
  function field(key, a, [k, label, type, ph, wide, hint]) {
    const v = esc(a[k] || '');
    const input = type === 'textarea' ? '<textarea class="in" rows="2" data-k="' + key + '" data-f="' + k + '" maxlength="600" placeholder="' + esc(ph) + '">' + v + '</textarea>'
      : '<input class="in" type="' + type + '" data-k="' + key + '" data-f="' + k + '" maxlength="300" placeholder="' + esc(ph) + '" value="' + v + '"' + (type === 'tel' ? ' inputmode="tel"' : type === 'number' ? ' inputmode="numeric" min="0"' : '') + '>';
    return '<label' + (wide ? ' class="wide"' : '') + '>' + esc(label) + input + (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</label>';
  }
  // which card is open (one at a time): a function id, 'x0'… for a new one, 'contacts', 'vip' or 'pkg'
  let openKey = null;
  const chev = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const t12 = t => { if (!t) return ''; const [h, m] = String(t).split(':').map(Number); return ((h % 12) || 12) + ':' + String(m || 0).padStart(2, '0') + (h < 12 ? ' am' : ' pm'); };
  const summaryOf = a => filled(a) ? [a.time ? 'Starts ' + t12(a.time) : '', a.venue].filter(Boolean).join(' · ') : 'Time, venue and address needed';
  // short events: the team covers 5 hours from the start (Ravi, 11 Nov 2026)
  const shortNote = '<div class="shortnote"><b>Short event: 5-hour coverage</b>Our team covers up to 5 hours from the start time. Please plan the main rituals within those 5 hours, and tell us early if you need longer.</div>';
  const fcard = (key, cls, sumInner, body) => '<article class="fn' + cls + (openKey === key ? ' open' : '') + '" data-card="' + esc(key) + '"><button type="button" class="fn-sum" data-open="' + esc(key) + '" aria-expanded="' + (openKey === key) + '">' + sumInner + chev + '</button><div class="fn-body">' + body + '</div></article>';
  const doneBtn = '<button type="button" class="pillbtn light done-btn" data-close>Done</button>';
  const coupleTitle = () => { const c2 = ans.couple || {}; return c2.bride && c2.groom ? String(c2.bride).trim().split(/\s+/)[0] + ' & ' + String(c2.groom).trim().split(/\s+/)[0] : ''; };
  function render() {
    const total = fns.length + ans.extra.length, done = fns.filter(f => filled(ans[f.id])).length + ans.extra.filter(filled).length;
    const first = fns.find(f => f.date >= today), daysTo = first ? Math.round((new Date(first.date + 'T12:00:00') - new Date(today + 'T12:00:00')) / 864e5) : null;
    $('top').innerHTML = '<section class="hero"><div class="hero-top"><span class="k">Your wedding</span>' + (daysTo != null ? '<span class="badge-w">' + (daysTo === 0 ? 'Today!' : daysTo + ' day' + (daysTo === 1 ? '' : 's') + ' to go') + '</span>' : '') + '</div>' +
      '<h2>' + esc(coupleTitle() || got.title) + '</h2><p>Tap a function to add or change its time and venue, then tap <b>Send to Muto\'s</b>. You can update it any time; our team sees what you send.</p>' +
      '<div class="progress" aria-label="' + done + ' of ' + total + ' ready"><i style="width:' + (total ? Math.round(100 * done / total) : 0) + '%"></i></div><p style="font-size:13px;font-weight:600">' + done + ' of ' + total + ' function' + (total === 1 ? '' : 's') + ' ready</p>' +
      (preview ? '<div class="ans wait" style="margin:0">Preview: this is what the family sees after signing in. Only their Gmail can fill it in.</div>' : '') +
      (studio ? '<div class="ans wait" style="margin:0" id="studio-note">Editing for the family, from Muto\'s. Your changes save here and the family sees them. Only the family can press Send.' + (got.updated_by ? ' Last changed by ' + esc(got.updated_by) + '.' : '') + '</div>' : '') +
      (late ? '<div class="ans wait" style="margin:0"><b>Payment reminder:</b> ' + inr(bk.overdue) + ' is overdue. Please clear it or call Muto\'s if anything is unclear. Thank you!</div>' : '') +
      (submittedAt ? '<div class="ans ok" style="margin:0">✓ Sent to Muto\'s on ' + esc(new Date(submittedAt).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })) + '. Changed something? Tap Send again and our team sees it at once.</div>' : '') + '</section>';
    const cp = ans.couple, cpOk = !!(cp.bride && cp.groom);
    let h = fcard('couple', ' sec' + (cpOk ? ' done' : ''), '<span class="txt"><h2>The couple</h2><span class="meta">' + esc(cpOk ? cp.bride + ' & ' + cp.groom : 'Bride\'s and groom\'s names') + '</span></span><span class="go' + (cpOk ? ' ok' : '') + '">' + (cpOk ? 'Edit' : 'Add') + '</span>',
      '<div class="grid">' + field('couple', cp, ['bride', 'Bride\'s name', 'text', 'e.g. Divya Bansal', 'wide']) + field('couple', cp, ['groom', 'Groom\'s name', 'text', 'e.g. Swastik Gupta', 'wide']) + '</div>' + doneBtn);
    h += '<div class="sechead2">Your functions</div>';
    fns.forEach(f => {
      const a = ans[f.id] = ans[f.id] || {}, ok = filled(a), short = f.type === 'short';
      h += fcard(f.id, ok ? ' done' : '',
        (f.date ? dblock(f.date) : '') + '<span class="txt"><h2>' + esc(f.name) + '</h2><span class="meta">' + esc([f.date ? dayName(f.date).split(',')[0] : '', f.slot].filter(Boolean).join(' · ')) + '</span><span class="meta" style="display:block">' + esc(summaryOf(a)) + '</span></span>' +
        '<span class="go' + (ok ? ' ok' : '') + '">' + (ok ? 'Ready' : 'Add details') + '</span>',
        (short ? shortNote : '') + '<div class="grid">' + FIELDS.map(F => field(f.id, a, F)).join('') +
        '<label class="wide" style="flex-direction:row;align-items:center;gap:8px;font-weight:400;color:var(--ink)"><input type="checkbox" data-k="' + esc(f.id) + '" data-f="changed"' + (a.changed ? ' checked' : '') + ' style="width:20px;height:20px;accent-color:var(--rose)">The date or time has changed (write the new one in the notes)</label></div>' + doneBtn);
    });
    ans.extra.forEach((a, i) => {
      h += fcard('x' + i, filled(a) ? ' done' : '',
        '<span class="txt"><h2>' + esc(a.name || 'New function') + '</h2><span class="meta">' + esc([a.date ? dayName(a.date).split(',')[0] : '', a.slot].filter(Boolean).join(' · ') || 'Added by you: the studio will confirm it') + '</span><span class="meta" style="display:block">' + esc(summaryOf(a)) + '</span></span><span class="go' + (filled(a) ? ' ok' : '') + '">' + (filled(a) ? 'Ready' : 'Add details') + '</span>',
        '<div class="grid">' + field('x' + i, a, ['name', 'Function name', 'text', 'e.g. Tilak, Ring ceremony', 'wide']) + field('x' + i, a, ['date', 'Date', 'date', '']) +
        '<label>Time of day<select class="in" data-k="x' + i + '" data-f="slot">' + ['Morning', 'Evening', 'Full day'].map(s => '<option' + (a.slot === s ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></label>' +
        FIELDS.map(F => field('x' + i, a, F)).join('') + '</div><p style="margin:10px 0 0"><button type="button" class="x" data-rm="' + i + '">Remove this function</button></p>' + doneBtn);
    });
    if (!fns.length && !ans.extra.length) h += '<div class="empty">The studio has not added your functions yet. You can add them below.</div>';
    h += '<div id="more-slot"></div><div class="sechead2">For our team on the day</div>';
    const fnOpts = sel => '<option value="">All functions</option>' + fns.map(f => '<option value="' + esc(f.id) + '"' + (sel === f.id ? ' selected' : '') + '>' + esc(f.name) + '</option>').join('');
    const nC = ans.contacts.filter(p => p.name || p.phone).length, nV = ans.vip.filter(p => p.name || p.photo || p.pid).length, nR = ans.refs.filter(r => r.pid).length;
    h += fcard('contacts', ' sec', '<span class="txt"><h2>People to call</h2><span class="meta">' + (nC ? nC + ' added' : 'Family members our team can call at the venue') + '</span></span><span class="go' + (nC ? ' ok' : '') + '">' + (nC ? 'Edit' : 'Add') + '</span>',
      '<div id="sec-contacts">' + ans.contacts.map((p, i) => '<div class="ppl"><label>Name<input class="in" data-k="c' + i + '" data-f="name" maxlength="80" value="' + esc(p.name || '') + '"></label><label>Relation<input class="in" data-k="c' + i + '" data-f="rel" maxlength="60" value="' + esc(p.rel || '') + '" placeholder="e.g. Bride\'s brother"></label>' +
        '<label>Phone<input class="in" type="tel" inputmode="tel" data-k="c' + i + '" data-f="phone" maxlength="20" value="' + esc(p.phone || '') + '"></label><label>For<select class="in" data-k="c' + i + '" data-f="fn">' + fnOpts(p.fn) + '</select></label>' +
        '<button type="button" class="x" data-rmc="' + i + '" style="justify-self:start">Remove</button></div>').join('') +
      (ans.contacts.length < 12 ? '<button type="button" class="addrow" id="add-c">＋ Add a person to call</button>' : '') + '</div>' + doneBtn);
    h += fcard('vip', ' sec', '<span class="txt"><h2>Important people</h2><span class="meta">' + (nV ? nV + ' added' : 'Family members who must be in the photos') + '</span></span><span class="go' + (nV ? ' ok' : '') + '">' + (nV ? 'Edit' : 'Add') + '</span>',
      '<div id="sec-vip"><p class="meta" style="margin:0">Add a photo and name of grandparents and close relatives. Our team sees them before the shoot.</p>' + ans.vip.map((p, i) => '<div class="vip"><label class="ph"' + (p.pid ? ' data-pid="' + esc(p.pid) + '"' : '') + ' style="' + (p.photo && !p.pid ? 'background-image:url(' + esc(p.photo) + ')' : '') + '">' + (p.photo || p.pid ? '' : 'Add photo') + '<input type="file" accept="image/*" data-vph="' + i + '" aria-label="Photo"></label>' +
        '<div class="f"><input class="in" data-k="v' + i + '" data-f="name" maxlength="80" placeholder="Name" value="' + esc(p.name || '') + '"><input class="in" data-k="v' + i + '" data-f="rel" maxlength="60" placeholder="Relation, e.g. Groom\'s grandmother" value="' + esc(p.rel || '') + '"><button type="button" class="x" data-rmv="' + i + '" style="justify-self:start">Remove</button></div></div>').join('') +
      (ans.vip.length < 15 ? '<button type="button" class="addrow" id="add-v">＋ Add an important person</button>' : '') + '</div>' + doneBtn);
    if (onDrive || nR) h += fcard('refs', ' sec', '<span class="txt"><h2>Reference photos</h2><span class="meta">' + (nR ? nR + ' added' : 'Poses, decor, outfits you like') + '</span></span><span class="go' + (nR ? ' ok' : '') + '">' + (nR ? 'Edit' : 'Add') + '</span>',
      '<div id="sec-refs"><p class="meta" style="margin:0">Photos you would like our team to see: poses, decor, outfits, ideas. Add a line about each and pick the function. Saved in full quality for our team.</p>' +
      '<div class="refs">' + ans.refs.map((r, i) => r.pid ? '<div class="rf"><button type="button" class="open" data-pid="' + esc(r.pid) + '" data-rfi="' + i + '" aria-label="See the photo"></button>' +
        '<input class="in" data-k="r' + i + '" data-f="note" maxlength="120" placeholder="What about it?" value="' + esc(r.note || '') + '"><select class="in" data-k="r' + i + '" data-f="fn">' + fnOpts(r.fn) + '</select>' +
        '<button type="button" class="x" data-rmr="' + i + '" style="justify-self:start">Remove</button></div>' : '').join('') + '</div>' +
      (onDrive && ans.refs.length < 40 ? '<label class="addrow" style="display:block;text-align:center;cursor:pointer">＋ Add photos<input type="file" accept="image/*" multiple id="add-r" hidden></label><div class="upbar" id="r-bar" hidden><i></i></div>' : '') + '</div>' + doneBtn);
    if (bk) h += '<div class="sechead2">Your package</div>' + fcard('pkg', ' sec', '<span class="txt"><h2>' + (bk.package && bk.package !== 'Custom' ? esc(bk.package) : 'Package') + '</h2><span class="meta">Paid ' + inr(bk.paid) + ' of ' + inr(bk.total) + (bk.pending > 0 ? ' · ' + inr(bk.pending) + ' pending' : '') + '</span></span><span class="go ok">View</span>',
      ((bk.items || []).length ? '<ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.6">' + bk.items.map(it => '<li>' + esc(KL[it.kind] || it.kind) + (it.per === 'function' ? ' for each function' : '') + (it.note ? ' · ' + esc(it.note) : '') + '</li>').join('') + '</ul>' : '') +
      '<div class="grid" style="margin-top:12px"><div><div class="meta">Paid</div><b>' + inr(bk.paid) + '</b> <span class="meta" style="display:inline">of ' + inr(bk.total) + '</span></div><div><div class="meta">Pending</div><b>' + inr(bk.pending) + '</b></div>' +
      (bk.next_due ? '<div class="wide"><div class="meta">Next payment</div><b>' + inr(bk.next_amount) + '</b> · ' + esc(bk.next_label || '') + ' · ' + esc(dayName(bk.next_due)) + '</div>' : '') + '</div>');
    $('list').after($('more')); // keep the add button out of the list while it is rebuilt
    $('list').innerHTML = h;
    const slot = $('more-slot'); if (slot) slot.appendChild($('more'));
    $('more').hidden = preview; $('bar').hidden = preview;
    if (studio) $('send').hidden = true;
    if (preview) $('list').querySelectorAll('input, textarea, select').forEach(x => { x.disabled = true; });
    $('list').querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.open; openKey = openKey === k ? null : k; render(); if (openKey) { const el = $('list').querySelector('[data-card="' + k + '"]'); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); } }));
    $('list').querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { const k = openKey; openKey = null; render(); if (dirty) save(false); const el = k && $('list').querySelector('[data-card="' + k + '"]'); if (el) el.scrollIntoView({ block: 'nearest' }); }));
    $('list').querySelectorAll('[data-f]').forEach(inp => inp.addEventListener(inp.type === 'checkbox' || inp.tagName === 'SELECT' ? 'change' : 'input', () => {
      const k = inp.dataset.k, f = inp.dataset.f, list = /^[xcvr]\d+$/.test(k) ? { x: ans.extra, c: ans.contacts, v: ans.vip, r: ans.refs }[k[0]] : null, obj = list ? list[Number(k.slice(1))] : (ans[k] = ans[k] || {});
      obj[f] = inp.type === 'checkbox' ? inp.checked : inp.value.trim();
      dirty = true; $('saved').textContent = 'Not saved yet'; scheduleSave();
      if (k === 'couple') { const h2 = document.querySelector('#top .hero h2'); if (h2) h2.textContent = coupleTitle() || got.title; const m = document.querySelector('[data-card="couple"] .fn-sum .meta'); if (m) m.textContent = ans.couple.bride && ans.couple.groom ? ans.couple.bride + ' & ' + ans.couple.groom : 'Bride\'s and groom\'s names'; }
      if (submittedAt && !studio) { $('send').textContent = 'Send changes to Muto\'s'; $('send').classList.add('pulse'); }
      const c2 = inp.closest('.fn'); if (!list || k[0] === 'x') { const ok = filled(obj), go = c2.querySelector('.fn-sum .go'); c2.classList.toggle('done', ok); if (go) { go.classList.toggle('ok', ok); go.textContent = ok ? 'Ready' : 'Add details'; } }
    }));
    const on = (id, fn) => { const b = $(id); if (b) b.addEventListener('click', fn); };
    on('add-c', () => { ans.contacts.push({}); openKey = 'contacts'; render(); const r = document.querySelectorAll('#sec-contacts .ppl'); r[r.length - 1].querySelector('input').focus(); });
    on('add-v', () => { ans.vip.push({}); openKey = 'vip'; render(); const r = document.querySelectorAll('#sec-vip .vip'); r[r.length - 1].scrollIntoView({ block: 'center' }); });
    $('list').querySelectorAll('[data-rmc]').forEach(b => b.addEventListener('click', () => { ans.contacts.splice(Number(b.dataset.rmc), 1); dirty = true; render(); scheduleSave(); }));
    $('list').querySelectorAll('[data-rmv]').forEach(b => b.addEventListener('click', () => { ans.vip.splice(Number(b.dataset.rmv), 1); dirty = true; render(); scheduleSave(); }));
    $('list').querySelectorAll('[data-vph]').forEach(inp => inp.addEventListener('change', async () => {
      const file = inp.files && inp.files[0]; if (!file) return;
      const v = ans.vip[Number(inp.dataset.vph)];
      try {
        if (onDrive) {   // the studio's Google Drive, ~3000px (Ravi, 14 Nov 2026)
          inp.closest('.ph').classList.add('busy'); inp.closest('.ph').firstChild.textContent = 'Uploading…';
          const r = await P.upload(c, { kind: 'client', ref: token, purpose: 'vip', note: v.name || '' }, file, { max: 3000, quality: 0.9 });
          v.pid = r.id; delete v.photo;
        } else v.photo = await shrink(file);   // until the admin connects Google Drive: a small copy in the form, as before
        dirty = true; render(); scheduleSave();
      } catch (e) { toast(e.message, true); render(); }
    }));
    const addR = $('add-r');
    if (addR) addR.addEventListener('change', async () => {
      const files = [...addR.files].slice(0, 40 - ans.refs.length); addR.value = '';
      const bar = $('r-bar'); bar.hidden = false; let n = 0;
      for (const f of files) {
        try { const r = await P.upload(c, { kind: 'client', ref: token, purpose: 'ref', note: '' }, f, { max: 3000, quality: 0.9, onProgress: x => { bar.firstChild.style.width = Math.round((n + x) / files.length * 100) + '%'; } }); ans.refs.push({ pid: r.id, note: '', fn: '' }); n++; dirty = true; }
        catch (e) { toast('Photo ' + (n + 1) + ' not added: ' + e.message, true); break; }
      }
      openKey = 'refs'; render(); if (n) { scheduleSave(); toast(n + ' photo' + (n > 1 ? 's' : '') + ' added. Write a line about each if you like.'); }
    });
    $('list').querySelectorAll('[data-rmr]').forEach(b => b.addEventListener('click', () => { const r = ans.refs.splice(Number(b.dataset.rmr), 1)[0]; if (r && r.pid) P.remove(c, r.pid).catch(() => {}); dirty = true; render(); scheduleSave(); }));
    $('list').querySelectorAll('[data-rfi]').forEach(b => b.addEventListener('click', () => { const list = ans.refs.filter(r => r.pid); P.view(c, list.map(r => ({ pid: r.pid, title: r.note || 'Reference photo', sub: r.fn ? (fns.find(f => f.id === r.fn) || {}).name || '' : 'All functions' })), list.indexOf(ans.refs[+b.dataset.rfi])); }));
    if (P) P.fill($('list'), c);
    if (preview) $('list').querySelectorAll('.addrow, [data-rmc], [data-rmv], [data-rmr], [data-vph]').forEach(x => { x.hidden = true; });
    $('list').querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { ans.extra.splice(Number(b.dataset.rm), 1); openKey = null; dirty = true; render(); scheduleSave(); }));
  }
  let saveT = null, saving = false;
  function scheduleSave() { clearTimeout(saveT); saveT = setTimeout(() => save(false), 2500); }
  async function save(submit) {
    clearTimeout(saveT);
    if (saving) { setTimeout(() => save(submit), 400); return false; }
    saving = true; $('saved').textContent = 'Saving…';
    const clean = { extra: ans.extra.filter(a => Object.values(a).some(Boolean)), contacts: ans.contacts.filter(a => a.name || a.phone), vip: ans.vip.filter(a => a.name || a.photo || a.pid) };
    if (ans.refs.some(r => r.pid)) clean.refs = ans.refs.filter(r => r.pid).map(r => ({ pid: r.pid, note: String(r.note || '').trim().slice(0, 120), fn: r.fn || '' }));
    if (ans.couple && (ans.couple.bride || ans.couple.groom)) clean.couple = { bride: String(ans.couple.bride || '').trim().slice(0, 80), groom: String(ans.couple.groom || '').trim().slice(0, 80) };
    fns.forEach(f => { if (ans[f.id] && Object.values(ans[f.id]).some(Boolean)) clean[f.id] = ans[f.id]; });
    try {
      const { data, error } = await c.rpc('client_save', { p_token: token, p_data: clean, p_submit: !!submit });
      if (error || !data || data.error) throw new Error((data && data.error) || (error && error.message) || 'failed');
      dirty = false; if (submit) submittedAt = new Date().toISOString();
      $('saved').textContent = 'Saved ' + new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
      return true;
    } catch (e) { $('saved').textContent = 'Not saved: ' + e.message; toast('Could not save. Check your internet and tap Save again.', true); return false; }
    finally { saving = false; }
  }
  $('save').addEventListener('click', async () => { if (await save(false)) toast('Saved. You can come back to this link any time.'); });
  $('send').addEventListener('click', async () => {
    const missing = fns.filter(f => !filled(ans[f.id])).map(f => f.name);
    if (missing.length && !confirm('Not filled yet: ' + missing.join(', ') + '.\n\nSend what you have now? You can fill the rest later.')) return;
    if (await save(true)) { $('send').textContent = 'Send to Muto\'s'; $('send').classList.remove('pulse'); render(); toast('Thank you! Muto\'s has your details, and our team sees the venues now.'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });
  $('add-fn').addEventListener('click', () => { ans.extra.push({ slot: 'Evening' }); openKey = 'x' + (ans.extra.length - 1); render(); const el = $('list').querySelector('[data-card="' + openKey + '"]'); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); const n = el.querySelector('[data-f="name"]'); if (n) n.focus(); } });
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  render();
})();
</script>
</body>
</html>
