<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf6f2">
<title>Home · Muto's</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muto's">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
/* Team home (11 Nov 2026, Ravi): check in / out first, then five plain doors: My Shoots, My Attendance, My Work, My Requests, My Profile */
.att { background: var(--blush, #f4d9d0); border-radius: 28px; padding: 22px 20px; margin-top: 6px; }
.att .when { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.att h2 { margin: 6px 0 2px; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
.att p { margin: 0; font-size: 14px; color: var(--ink); }
.att .steps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.att .steps span { background: rgba(255,255,255,.75); border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.att .go { display: grid; gap: 10px; margin-top: 16px; }
.att .go button { min-height: 60px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: 700 18px var(--font-body); cursor: pointer; }
.att .go button.light { min-height: 48px; background: rgba(255,255,255,.8); color: var(--ink); font-size: 15px; font-weight: 600; }
.att .go button:disabled { opacity: .6; }
.att .more { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-size: 13.5px; }
.att .more button, .att .more a { background: none; border: 0; padding: 6px 0; min-height: 32px; font: 600 13.5px var(--font-body); color: var(--ink); text-decoration: underline; cursor: pointer; }
.doors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
.door { position: relative; background: var(--surface); color: var(--ink); border: 0; border-radius: 22px; min-height: 112px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; text-align: left; text-decoration: none; box-shadow: var(--shadow); font: inherit; cursor: pointer; }
.door svg { width: 26px; height: 26px; fill: none; stroke: var(--rose); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.door b { display: block; font-size: 16px; font-weight: 700; }
.door small { display: block; font-size: 12.5px; line-height: 1.3; color: var(--muted); margin-top: 2px; }
.door .count { position: absolute; top: 12px; right: 12px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--alert, #c9973f); color: var(--ink); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
.door.wide { grid-column: 1 / -1; min-height: 84px; flex-direction: row; align-items: center; justify-content: flex-start; gap: 14px; }
.codein { font: 700 30px var(--font-body); letter-spacing: .35em; text-align: center; }
.sheet-bg { position: fixed; inset: 0; background: rgba(42,30,34,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; border-radius: 24px 24px 0 0; padding: 20px 18px max(18px, env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
@media (min-width: 640px) { .sheet-bg { align-items: center; } .sheet { border-radius: 24px; } }
.sheet h3 { margin: 0 0 4px; font-size: 19px; }
.rowbtn { display: flex; width: 100%; align-items: center; gap: 12px; background: var(--bg); border: 0; border-radius: 16px; padding: 14px; margin-top: 10px; text-align: left; font: inherit; color: var(--ink); text-decoration: none; cursor: pointer; }
.rowbtn svg { width: 22px; height: 22px; fill: none; stroke: var(--rose); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.rowbtn b { display: block; font-size: 15px; } .rowbtn small { color: var(--muted); font-size: 12.5px; }
</style>
<script src="/config.js"></script>
<script src="/app-core.js"></script>
<script src="/icons.js"></script>
<script src="/payroll.js"></script>
<script src="/att-data.js"></script>
</head>
<body>
<main class="wrap">
  <header class="hdr topbar">
    <span class="logo" role="img" aria-label="Muto's"><b aria-hidden="true">Muto's</b></span>
    <div class="hdr-acts"><button type="button" class="roundbtn" id="out" aria-label="Sign out" title="Sign out"></button></div>
  </header>
  <section class="hello"><span class="avatar soft" id="av" aria-hidden="true"></span><div><h1 id="hello">Hello</h1><p class="sub" id="sub">Loading…</p></div></section>
  <div id="att"></div>
  <div class="sechead" id="menu-h" hidden><h2>My menu</h2></div>
  <div class="doors" id="doors"></div>
  <div class="toast" id="toast" hidden></div>
</main>
<script>
(async function () {
  const $ = id => document.getElementById(id), A = window.MutosAtt, P = window.MutosPay, IC = n => window.MUTOS_ICON(n);
  const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
  let toastT = null;
  const toast = (m, bad) => { const t = $('toast'); t.textContent = m; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4500); };
  $('out').innerHTML = IC('logout', 20);
  $('out').addEventListener('click', () => window.mutosApp.signOut());

  const app = window.mutosApp; let me, c;
  try { me = await app.me(); } catch (e) { $('sub').innerHTML = '<span class="err">Could not reach the app. Check your internet and reload.</span>'; return; }
  if (!me || !me.role) { location.replace('/'); return; }
  if (!['crew', 'staff'].includes(me.role)) { location.replace(app.homeFor(me.role)); return; } // owner, manager, gear desk… have their own home
  c = await app.client();

  let emp = null, person = null, shoots = [], att = null, jobsOpen = 0, awayPending = 0;
  const safe = async q => { try { const r = await q; return r && !r.error ? r.data : null; } catch (e) { return null; } };
  async function load() {
    const today = A.todayIST();
    const [e, p, f] = await Promise.all([
      safe(c.from('employees').select('*').eq('email', me.email).maybeSingle()),
      safe(c.from('people').select('id, name, code, title').eq('email', me.email).maybeSingle()),
      me.personKey ? safe(c.from('crew_feed').select('data').eq('person_key', me.personKey).maybeSingle()) : null
    ]);
    emp = e && e.active ? e : null; person = p || null;
    shoots = ((f && f.data && f.data.shoots) || []).filter(s => s.date >= today).sort((a, b) => a.date.localeCompare(b.date));
    att = emp ? await A.loadMonth(c, A.monthOf(today), [emp.email]).catch(() => null) : null;
    if (person) { const j = await safe(c.from('work_jobs').select('id, status').eq('assignee', person.id)); jobsOpen = (j || []).filter(x => x.status !== 'final').length; }
    if (me.personKey) { const a = await safe(c.from('crew_away').select('id, status').eq('person_key', me.personKey).eq('status', 'pending')); awayPending = (a || []).length; }
  }

  // ---------- check in / out ----------
  const nextStep = list => ({ '': ['in', 'Check in'], in: ['out', 'Check out', 'lunch_out', 'Lunch break'], lunch_out: ['lunch_in', 'Back from lunch'], lunch_in: ['out', 'Check out'], out: [] }[list.length ? list[list.length - 1].kind : '']);
  function renderAtt() {
    const box = $('att');
    if (!emp || !att) { box.innerHTML = ''; return; }
    const t = A.todayIST(), list = att.punches.filter(p => p.day === t && p.email === emp.email).sort((a, b) => a.at.localeCompare(b.at));
    const step = nextStep(list) || [], at = k => { const p = list.filter(x => x.kind === k).pop(); return p ? P.fmtT(P.istMin(p.at)) : ''; };
    const shootToday = shoots.find(s => s.date === t), hol = att.holidays.find(h => h.day === t), off = new Date(t + 'T12:00:00Z').getUTCDay() === emp.weekly_off;
    let state, line;
    if (!list.length) { state = 'Not checked in'; line = hol ? 'Today is a holiday: ' + hol.name : off ? 'Today is your weekly off' : shootToday ? 'You have a shoot today (' + shootToday.slot + ')' : 'Your time is ' + A.t12(emp.start_time); }
    else if (step[0] === 'lunch_in') { state = 'At lunch'; line = 'Since ' + at('lunch_out'); }
    else if (!step.length) { state = 'Checked out'; line = 'In ' + at('in') + ' · out ' + at('out'); }
    else { state = 'In office'; line = 'Since ' + at('in'); }
    box.innerHTML = '<section class="att" aria-label="Attendance today"><div class="when"><span>Attendance today</span></div>' +
      '<h2 id="att-state">' + esc(state) + '</h2><p>' + esc(line) + '</p>' +
      (list.length ? '<div class="steps">' + list.map(p => '<span>' + { in: 'In', lunch_out: 'Lunch', lunch_in: 'Back', out: 'Out' }[p.kind] + ' ' + P.fmtT(P.istMin(p.at)) + '</span>').join('') + '</div>' : '') +
      (step.length ? '<div class="go"><button type="button" data-punch="' + step[0] + '">' + step[1] + '</button>' + (step[2] ? '<button type="button" class="light" data-punch="' + step[2] + '">' + step[3] + '</button>' : '') + '</div>' : '') +
      '<div class="more">' + (canUndo(list) ? '<button type="button" id="att-undo">Tapped by mistake? Undo</button>' : '') + '<a id="att-fix" href="/work.html?tab=req&new=fix&what=' + (list.some(p => p.kind === 'out') ? 'out' : 'in') + '">Wrong time? Ask for a correction</a></div></section>';
    const ub = box.querySelector('#att-undo'); if (ub) ub.addEventListener('click', () => undo(ub));
    box.querySelectorAll('[data-punch]').forEach(b => b.addEventListener('click', () => punch(b.dataset.punch, b.textContent, b)));
  }
  // a tap by mistake can be taken back for 10 minutes (013_undo_punch.sql); later it needs a correction request
  const canUndo = list => { const l = list[list.length - 1]; return !!l && !l.by_fix && Date.now() - Date.parse(l.at) < 10 * 60000; };
  async function undo(btn) {
    btn.disabled = true;
    const { data: r, error } = await c.rpc('att_undo');
    if (error || !r || r.error) { toast((r && r.error) || (error && /att_undo/.test(error.message) ? 'Undo is not set up yet. Ask Ravi.' : error && error.message) || 'Could not undo.', true); btn.disabled = false; return; }
    toast({ in: 'Check-in', out: 'Check-out', lunch_out: 'Lunch break', lunch_in: 'Back from lunch' }[r.kind] + ' undone.');
    await load(); render();
  }
  async function punch(kind, label, btn) {
    let code = null;
    if (att.settings.code_on !== false) { code = await askCode(label); if (code == null) return; }
    btn.disabled = true; toast('Checking your location…');
    let pos; try { pos = await A.locate(); } catch (e) { toast(e.message, true); btn.disabled = false; return; }
    const { data: r, error } = await c.rpc('att_punch', { p_kind: kind, p_lat: pos.lat, p_lng: pos.lng, p_acc: pos.acc, p_code: code });
    if (error || !r || r.error) { toast((r && r.error) || (error && error.message) || 'Could not save.', true); btn.disabled = false; return; }
    toast({ in: 'Checked in. Have a good day!', lunch_out: 'Enjoy your lunch. 45 minutes.', lunch_in: 'Welcome back.', out: 'Checked out. See you tomorrow!' }[kind] + (r.flag === 'holiday_unasked' ? ' (Today is a holiday: Ravi will be told you came in.)' : ''));
    await load(); render();
    // checked out and on the work desk: today's report, if it is not written yet
    if (kind === 'out' && person) {
      const rr = await safe(c.from('work_reports').select('id').eq('person', person.id).eq('day', A.todayIST()).limit(1));
      if (rr && !rr.length) setTimeout(() => location.assign('/mywork.html?tab=rep'), 1200);
    }
  }
  function askCode(label) {
    return new Promise(done => {
      const bg = document.createElement('div'); bg.className = 'sheet-bg';
      bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><h3>' + esc(label) + '</h3><p class="sub" style="margin-bottom:14px">Type the 6-digit code shown on the office screen.</p>' +
        '<input class="in codein" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="Office code">' +
        '<div class="pillrow" style="margin-top:14px"><button type="button" class="pillbtn light" id="cx">Cancel</button><button type="button" class="pillbtn" id="go">' + esc(label) + '</button></div></div>';
      document.body.appendChild(bg);
      const inp = bg.querySelector('#code'); setTimeout(() => inp.focus(), 50);
      const close = v => { bg.remove(); done(v); };
      bg.querySelector('#cx').addEventListener('click', () => close(null));
      bg.addEventListener('click', e => { if (e.target === bg) close(null); });
      const go = () => { const v = inp.value.replace(/\D/g, ''); if (v.length !== 6) { toast('The code has 6 digits.', true); return; } close(v); };
      bg.querySelector('#go').addEventListener('click', go);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });
  }

  // ---------- the five doors ----------
  const day = s => { const t = A.todayIST(), d = new Date(s + 'T12:00:00Z'); return s === t ? 'Today' : d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }); };
  function sheet(title, rows) {
    const bg = document.createElement('div'); bg.className = 'sheet-bg';
    bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><h3>' + esc(title) + '</h3>' + rows.join('') + '<div class="pillrow" style="margin-top:14px;grid-template-columns:1fr"><button type="button" class="pillbtn light" id="cx">Close</button></div></div>';
    document.body.appendChild(bg);
    bg.querySelector('#cx').addEventListener('click', () => bg.remove());
    bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
    return bg;
  }
  const row = (href, ic, title, sub) => '<a class="rowbtn" href="' + href + '">' + IC(ic) + '<span><b>' + esc(title) + '</b><small>' + esc(sub) + '</small></span></a>';
  function renderDoors() {
    const hasShoots = me.role === 'crew' && !!me.personKey;   // office-only employees have no shoots
    const pendReq = att ? att.requests.filter(r => r.email === emp.email && r.status === 'pending').length : 0;
    const doors = [];
    if (hasShoots) { const n = shoots[0]; doors.push(['shoots', '/crew.html', 'calendar', 'My Shoots', n ? 'Next: ' + day(n.date) + ' · ' + n.shoot : 'No shoots coming up', shoots.filter(s => s.date === A.todayIST()).length]); }
    if (emp) doors.push(['att', '/work.html?tab=month', 'clock', 'My Attendance', 'Month, history and pay', 0]);
    if (person) doors.push(['work', '/mywork.html', 'film', 'My Work', jobsOpen ? jobsOpen + ' job' + (jobsOpen > 1 ? 's' : '') + ' open' : 'Jobs, daily report, drives', 0]);
    if (emp || hasShoots) doors.push(['req', '#', 'log', 'My Requests', emp ? 'Leave, advance, correction' + (hasShoots ? ', day off' : '') : 'Days off from shoots', pendReq + awayPending]);
    doors.push(['profile', '#', 'idcard', 'My Profile', person ? [person.code, person.title].filter(Boolean).join(' · ') || 'Your details' : 'Your details', 0]);
    $('menu-h').hidden = false;
    $('doors').innerHTML = doors.map(([k, href, ic, title, sub, n], i) => {
      const wide = doors.length % 2 === 1 && i === doors.length - 1 ? ' wide' : '';
      const inner = IC(ic) + '<span><b>' + esc(title) + '</b><small>' + esc(sub) + '</small></span>' + (n ? '<span class="count">' + n + '</span>' : '');
      return href === '#' ? '<button type="button" class="door' + wide + '" data-go="' + k + '">' + inner + '</button>' : '<a class="door' + wide + '" data-go="' + k + '" href="' + href + '">' + inner + '</a>';
    }).join('');
    const rq = $('doors').querySelector('button[data-go="req"]');
    if (rq) rq.addEventListener('click', () => {
      const rows = [];
      if (emp) rows.push(row('/work.html?tab=req', 'log', 'Leave, advance or attendance correction', 'Ask for leave or an advance, or fix a missed check-in. See what was approved.'));
      if (hasShoots) rows.push(row('/crew.html?tab=away', 'off', 'Day off from shoots', 'Tell the studio which dates you cannot shoot.'));
      if (rows.length === 1) { location.assign(emp ? '/work.html?tab=req' : '/crew.html?tab=away'); return; }
      sheet('My Requests', rows);
    });
    $('doors').querySelector('button[data-go="profile"]').addEventListener('click', () => {
      if (person) { location.assign('/mywork.html?tab=me'); return; }
      const bg = sheet('My Profile', ['<div class="rowbtn" style="cursor:default">' + IC('idcard') + '<span><b>' + esc((emp && emp.name) || me.name) + '</b><small>' + esc(me.email) + '</small></span></div>',
        '<button type="button" class="rowbtn" id="so">' + IC('logout') + '<span><b>Sign out</b><small>Use another Google account</small></span></button>']);
      bg.querySelector('#so').addEventListener('click', () => app.signOut());
    });
  }
  function render() {
    const name = (emp && emp.name) || (person && person.name) || me.name || me.email, first = String(name).split(/[\s@]/)[0];
    $('hello').textContent = 'Hello, ' + first.charAt(0).toUpperCase() + first.slice(1);
    $('av').textContent = first.charAt(0).toUpperCase();
    $('sub').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
    renderAtt(); renderDoors();
  }
  try { await load(); render(); } catch (e) { $('sub').innerHTML = '<span class="err">Could not load (' + esc(e.message || e) + '). Pull down to try again.</span>'; }
  // coming back to the app: fresh numbers (a phone stops the page in the background)
  setInterval(() => { if (!document.hidden && !document.querySelector('.sheet-bg')) renderAtt(); }, 60000); // the Undo offer ends after 10 minutes
  document.addEventListener('visibilitychange', async () => { if (!document.hidden && !document.querySelector('.sheet-bg')) { try { await load(); render(); } catch (e) {} } });
})();
</script>
</body>
</html>
